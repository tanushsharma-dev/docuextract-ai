<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — DocuExtract AI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter','Segoe UI',system-ui,sans-serif; }
  html, body { background:#050814; color:#e2e8f0; min-height:100vh; }
  body {
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(1000px 500px at 80% -10%, rgba(139,92,246,.25), transparent 60%),
      radial-gradient(800px 400px at 10% 0%, rgba(6,182,212,.18), transparent 60%),
      #050814;
    padding:20px;
  }

  .card {
    width:100%; max-width:420px;
    background:rgba(9,13,28,.85);
    border:1px solid rgba(148,163,184,.15);
    border-radius:20px;
    padding:40px 32px;
    backdrop-filter:blur(20px);
    box-shadow:0 24px 60px rgba(0,0,0,.5);
  }

  .brand { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:8px; }
  .brand-mark {
    width:48px; height:48px; border-radius:14px;
    background:linear-gradient(135deg,#06b6d4,#8b5cf6);
    display:grid; place-items:center; font-size:24px;
    box-shadow:0 8px 24px rgba(139,92,246,.4);
  }
  .brand h1 { font-size:22px; }
  .brand h1 span { background:linear-gradient(135deg,#22d3ee,#a78bfa);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

  .tagline { text-align:center; color:#64748b; font-size:12px;
    letter-spacing:.2em; text-transform:uppercase; margin-bottom:32px; }

  h2 { font-size:24px; text-align:center; margin-bottom:6px; }
  .sub { text-align:center; color:#94a3b8; font-size:14px; margin-bottom:26px; }

  .form-group { margin-bottom:16px; }
  label { display:block; font-size:12px; color:#94a3b8; margin-bottom:6px; font-weight:500; }
  input {
    width:100%; padding:12px 14px;
    background:rgba(15,23,42,.8);
    border:1px solid rgba(148,163,184,.2);
    border-radius:10px; color:#e2e8f0;
    font-size:14px; font-family:inherit;
    transition:.2s;
  }
  input:focus { outline:none; border-color:#22d3ee; box-shadow:0 0 0 3px rgba(34,211,238,.1); }
  input::placeholder { color:#475569; }

  .btn {
    width:100%; padding:13px;
    border:none; border-radius:10px;
    font-size:14px; font-weight:700;
    cursor:pointer; font-family:inherit;
    transition:.2s; margin-top:8px;
  }
  .btn-primary {
    background:linear-gradient(135deg,#22d3ee,#8b5cf6);
    color:#fff;
    box-shadow:0 8px 24px rgba(34,211,238,.3);
  }
  .btn-primary:hover { transform:translateY(-1px); box-shadow:0 12px 32px rgba(34,211,238,.4); }
  .btn-primary:disabled { opacity:.5; cursor:not-allowed; transform:none; }

  .divider { display:flex; align-items:center; gap:12px; margin:22px 0; color:#475569; font-size:12px; }
  .divider::before, .divider::after {
    content:''; flex:1; height:1px;
    background:linear-gradient(90deg, transparent, rgba(148,163,184,.2), transparent);
  }

  .btn-google {
    background:rgba(15,23,42,.8);
    border:1px solid rgba(148,163,184,.2);
    color:#e2e8f0;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .btn-google:hover { background:rgba(30,41,59,.8); border-color:rgba(148,163,184,.4); }
  .btn-google svg { width:18px; height:18px; }

  .switch { text-align:center; margin-top:22px; font-size:13px; color:#64748b; }
  .switch a { color:#22d3ee; text-decoration:none; font-weight:600; }
  .switch a:hover { text-decoration:underline; }

  .alert {
    display:none; padding:12px 14px; border-radius:10px;
    font-size:13px; margin-bottom:16px;
  }
  .alert.show { display:block; }
  .alert-error { background:rgba(239,68,68,.12); color:#f87171; border:1px solid rgba(239,68,68,.3); }
  .alert-success { background:rgba(16,185,129,.12); color:#34d399; border:1px solid rgba(16,185,129,.3); }

  .spinner {
    display:inline-block; width:14px; height:14px;
    border:2px solid currentColor; border-bottom-color:transparent;
    border-radius:50%; animation:spin .8s linear infinite;
    margin-right:8px; vertical-align:middle;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-mark">📄</div>
    <h1>DocuExtract <span>AI</span></h1>
  </div>
  <div class="tagline">Document Intelligence</div>

  <h2>Welcome back</h2>
  <p class="sub">Sign in to continue to your dashboard</p>

  <div id="alert" class="alert"></div>

  <form id="loginForm" onsubmit="return handleLogin(event)">
    <div class="form-group">
      <label for="username">Email or Username</label>
      <input type="text" id="username" placeholder="you@example.com" required autocomplete="username">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
  </form>

  <div class="divider">OR</div>

  <button type="button" class="btn btn-google" onclick="handleGoogleLogin()">
    <svg viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Sign in with Google
  </button>

  <div class="switch">
    Don't have an account? <a href="/ui/signup.html">Sign up</a>
  </div>
</div>

<script>
  console.log('[Login] Page loaded');

  const alertEl = document.getElementById('alert');

  function showAlert(msg, type) {
    alertEl.textContent = msg;
    alertEl.className = 'alert show alert-' + (type || 'error');
  }
  function hideAlert() {
    alertEl.className = 'alert';
  }

  // ============================================================
  // STEP 1: HANDLE GOOGLE CALLBACK (URL params)
  // ============================================================
  (function handleGoogleCallback() {
    const params = new URLSearchParams(window.location.search);

    // Success case: google_token present
    const gToken = params.get('google_token');
    const gRefresh = params.get('refresh');
    const gUser = params.get('user');
    const gSuccess = params.get('google_success');

    if (gToken && gSuccess) {
      console.log('[Login] Google login success — saving token');
      localStorage.setItem('token', gToken);
      if (gRefresh) localStorage.setItem('refresh_token', gRefresh);
      if (gUser) localStorage.setItem('username', gUser);

      showAlert('✅ Login successful! Redirecting…', 'success');
      // Clean URL and redirect to dashboard
      setTimeout(() => {
        window.location.href = '/ui/index.html';
      }, 500);
      return;
    }

    // Error case: google_error present
    const gError = params.get('google_error');
    if (gError) {
      console.error('[Login] Google error:', gError);
      const messages = {
        'access_denied': 'You cancelled the Google login.',
        'no_code': 'Google did not send a code. Try again.',
        'token_failed': 'Token exchange failed. Check Google Console redirect URI.',
        'no_token': 'No access token received from Google.',
        'userinfo_failed': 'Could not fetch your Google profile.',
        'no_email': 'Your Google account has no email.',
        'db_error': 'Database error. Try again.',
        'timeout': 'Google took too long. Try again.',
        'token_issue': 'Server failed to create session.',
        'exception': 'Something went wrong. Check server logs.',
      };
      showAlert(messages[gError] || ('Google error: ' + gError), 'error');

      // Clean URL so refresh doesn't re-show error
      window.history.replaceState({}, document.title, '/ui/login.html');
    }
  })();

  // ============================================================
  // STEP 2: Check if already logged in
  // ============================================================
  const existingToken = localStorage.getItem('token');
  if (existingToken && !new URLSearchParams(window.location.search).get('google_error')) {
    // Optional: verify token is still valid
    fetch('/api/v1/auth/me', {
      headers: { 'Authorization': 'Bearer ' + existingToken }
    }).then(r => {
      if (r.ok) {
        console.log('[Login] Already logged in — redirecting');
        window.location.href = '/ui/index.html';
      } else {
        // Token expired — clear it
        localStorage.removeItem('token');
      }
    }).catch(() => {});
  }

  // ============================================================
  // STEP 3: Regular login form
  // ============================================================
  async function handleLogin(e) {
    e.preventDefault();
    hideAlert();

    const btn = document.getElementById('loginBtn');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      showAlert('Please fill in all fields.', 'error');
      return false;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Signing in…';

    try {
      const res = await fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        throw new Error(data.detail || ('HTTP ' + res.status));
      }

      // Save tokens
      localStorage.setItem('token', data.access_token);
      if (data.refresh_token) localStorage.setItem('refresh_token', data.refresh_token);
      if (data.user && data.user.username) localStorage.setItem('username', data.user.username);

      showAlert('✅ Login successful!', 'success');
      setTimeout(() => {
        window.location.href = '/ui/index.html';
      }, 400);

    } catch (err) {
      console.error('[Login] Error:', err);
      showAlert(err.message || 'Login failed', 'error');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }

    return false;
  }

  // ============================================================
  // STEP 4: Google login button
  // ============================================================
  function handleGoogleLogin() {
    console.log('[Login] Google login clicked — redirecting');
    window.location.href = '/api/v1/auth/google';
  }
</script>
</body>
</html>
