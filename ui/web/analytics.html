<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocuExtract AI — Analytics Dashboard</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  
  body {
    background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1629 100%);
    color: #e2e8f0;
    min-height: 100vh;
    padding: 0;
  }
  
  .container { max-width: 1400px; margin: 0 auto; padding: 32px 24px; }
  
  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
    flex-wrap: wrap;
    gap: 16px;
  }
  
  .header-left h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #06b6d4 0%, #a855f7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }
  
  .header-left p { color: #94a3b8; font-size: 14px; }
  
  .header-right { display: flex; gap: 12px; align-items: center; }
  
  .status-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.3);
    border-radius: 999px;
    font-size: 12px;
    color: #34d399;
  }
  
  .status-dot {
    width: 6px;
    height: 6px;
    background: #34d399;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  
  .btn {
    padding: 10px 18px;
    background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.3s;
  }
  
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(6, 182, 212, 0.4); }
  
  .btn-secondary {
    background: rgba(148, 163, 184, 0.1);
    border: 1px solid rgba(148, 163, 184, 0.2);
  }
  
  .btn-secondary:hover { background: rgba(148, 163, 184, 0.2); }
  
  /* Stats Grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
  }
  
  .stat-card {
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(148, 163, 184, 0.1);
    border-radius: 16px;
    padding: 24px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #06b6d4, #a855f7);
    opacity: 0;
    transition: opacity 0.3s;
  }
  
  .stat-card:hover {
    transform: translateY(-4px);
    border-color: rgba(6, 182, 212, 0.3);
    box-shadow: 0 12px 40px rgba(6, 182, 212, 0.15);
  }
  
  .stat-card:hover::before { opacity: 1; }
  
  .stat-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  
  .stat-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  
  .stat-icon.blue { background: rgba(6, 182, 212, 0.15); }
  .stat-icon.green { background: rgba(16, 185, 129, 0.15); }
  .stat-icon.amber { background: rgba(245, 158, 11, 0.15); }
  .stat-icon.red { background: rgba(239, 68, 68, 0.15); }
  .stat-icon.purple { background: rgba(168, 85, 247, 0.15); }
  
  .stat-trend {
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    font-weight: 500;
  }
  
  .stat-trend.up { background: rgba(16, 185, 129, 0.15); color: #34d399; }
  .stat-trend.down { background: rgba(239, 68, 68, 0.15); color: #f87171; }
  
  .stat-value {
    font-size: 36px;
    font-weight: 700;
    margin-bottom: 4px;
    background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  
  .stat-label {
    font-size: 13px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  
  /* Main Grid */
  .main-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 24px;
    margin-bottom: 24px;
  }
  
  @media (max-width: 968px) {
    .main-grid { grid-template-columns: 1fr; }
  }
  
  .panel {
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(148, 163, 184, 0.1);
    border-radius: 16px;
    padding: 28px;
  }
  
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  
  .panel-title {
    font-size: 16px;
    font-weight: 600;
    color: #e2e8f0;
  }
  
  .panel-subtitle {
    font-size: 12px;
    color: #64748b;
    margin-top: 2px;
  }
  
  /* Document Type Bars */
  .type-list { display: flex; flex-direction: column; gap: 16px; }
  
  .type-item {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  
  .type-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    background: rgba(6, 182, 212, 0.1);
  }
  
  .type-info { flex: 1; }
  
  .type-name {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 6px;
    text-transform: capitalize;
  }
  
  .type-bar {
    height: 8px;
    background: rgba(148, 163, 184, 0.1);
    border-radius: 999px;
    overflow: hidden;
  }
  
  .type-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #06b6d4 0%, #a855f7 100%);
    border-radius: 999px;
    transition: width 0.6s ease;
  }
  
  .type-count {
    font-size: 14px;
    font-weight: 600;
    color: #e2e8f0;
    min-width: 50px;
    text-align: right;
  }
  
  /* Status Breakdown */
  .status-list { display: flex; flex-direction: column; gap: 12px; }
  
  .status-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: rgba(148, 163, 184, 0.05);
    border-radius: 10px;
    transition: all 0.2s;
  }
  
  .status-item:hover { background: rgba(148, 163, 184, 0.1); }
  
  .status-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .status-dot-large {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  
  .status-dot-large.green { background: #10b981; }
  .status-dot-large.amber { background: #f59e0b; }
  .status-dot-large.red { background: #ef4444; }
  
  .status-name { font-size: 14px; font-weight: 500; }
  
  .status-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .status-count {
    font-size: 16px;
    font-weight: 700;
  }
  
  .status-percent {
    font-size: 12px;
    color: #64748b;
    padding: 4px 8px;
    background: rgba(148, 163, 184, 0.1);
    border-radius: 6px;
  }
  
  /* Confidence Meter */
  .confidence-meter {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px;
    background: rgba(148, 163, 184, 0.05);
    border-radius: 12px;
    margin-top: 20px;
  }
  
  .confidence-circle {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: conic-gradient(#06b6d4 0deg, #06b6d4 var(--deg), rgba(148, 163, 184, 0.1) var(--deg), rgba(148, 163, 184, 0.1) 360deg);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  
  .confidence-circle::before {
    content: '';
    position: absolute;
    width: 64px;
    height: 64px;
    background: #0f172a;
    border-radius: 50%;
  }
  
  .confidence-value {
    position: relative;
    font-size: 18px;
    font-weight: 700;
  }
  
  .confidence-info h3 {
    font-size: 14px;
    margin-bottom: 4px;
  }
  
  .confidence-info p {
    font-size: 12px;
    color: #64748b;
  }
  
  /* Footer */
  .footer {
    text-align: center;
    padding: 20px;
    color: #64748b;
    font-size: 12px;
  }
  
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px;
    color: #64748b;
  }
  
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(6, 182, 212, 0.2);
    border-top-color: #06b6d4;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 12px;
  }
  
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <h1>📊 Analytics Dashboard</h1>
      <p>Real-time document processing insights</p>
    </div>
    <div class="header-right">
      <div class="status-badge">
        <div class="status-dot"></div>
        <span id="statusText">Live</span>
      </div>
      <button class="btn" onclick="load()">↻ Refresh</button>
      <button class="btn btn-secondary" onclick="location.href='/ui/'">← Back</button>
    </div>
  </div>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <span>Loading analytics…</span>
  </div>

  <div id="content" style="display:none">
    <div class="stats-grid" id="statsGrid"></div>

    <div class="main-grid">
      <div class="panel">
        <div class="panel-header">
          <div>
            <div class="panel-title">Document Types</div>
            <div class="panel-subtitle">Distribution across categories</div>
          </div>
        </div>
        <div class="type-list" id="typeList"></div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <div>
            <div class="panel-title">Processing Status</div>
            <div class="panel-subtitle">Current pipeline state</div>
          </div>
        </div>
        <div class="status-list" id="statusList"></div>

        <div class="confidence-meter">
          <div class="confidence-circle" id="confCircle" style="--deg: 0deg">
            <div class="confidence-value" id="confValue">0%</div>
          </div>
          <div class="confidence-info">
            <h3>Avg Confidence</h3>
            <p>AI extraction accuracy</p>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      Last updated: <span id="lastUpdate">—</span> · Data refreshes every 60 seconds
    </div>
  </div>
</div>

<script>
const TYPE_ICONS = {
  invoice: '',
  receipt: '🧾',
  bank_statement: '🏦',
  id_card: '🪪',
  form: '📋'
};

async function load() {
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('content').style.display = 'none';

  try {
    const t0 = performance.now();
    const res = await fetch('/api/v1/analytics/overview');
    const d = await res.json();
    const ms = Math.round(performance.now() - t0);

    document.getElementById('statusText').textContent = (d.cached ? '⚡ Cached' : '🌐 Live') + ` · ${ms}ms`;

    // Stats Cards
    const stats = [
      { icon: '📄', value: d.total_documents, label: 'Total Documents', trend: '+12%', color: 'blue' },
      { icon: '✅', value: d.auto_approved, label: 'Auto-Approved', trend: '+8%', color: 'green' },
      { icon: '⚠️', value: d.needs_review, label: 'Needs Review', trend: '+3%', color: 'amber' },
      { icon: '❌', value: d.failed, label: 'Failed', trend: '-2%', color: 'red' },
      { icon: '🎯', value: d.avg_confidence + '%', label: 'Avg Confidence', trend: '+5%', color: 'purple' }
    ];

    document.getElementById('statsGrid').innerHTML = stats.map(s => `
      <div class="stat-card">
        <div class="stat-header">
          <div class="stat-icon ${s.color}">${s.icon}</div>
          <div class="stat-trend up">${s.trend}</div>
        </div>
        <div class="stat-value">${s.value}</div>
        <div class="stat-label">${s.label}</div>
      </div>
    `).join('');

    // Document Types
    const entries = Object.entries(d.by_type || {}).filter(([k]) => k);
    const max = Math.max(1, ...entries.map(([, v]) => v));
    
    document.getElementById('typeList').innerHTML = entries.map(([k, v]) => `
      <div class="type-item">
        <div class="type-icon">${TYPE_ICONS[k] || '📄'}</div>
        <div class="type-info">
          <div class="type-name">${k.replace(/_/g, ' ')}</div>
          <div class="type-bar">
            <div class="type-bar-fill" style="width: ${(v / max) * 100}%"></div>
          </div>
        </div>
        <div class="type-count">${v}</div>
      </div>
    `).join('') || '<p style="color:#64748b">No documents yet</p>';

    // Status Breakdown
    const total = d.total_documents || 1;
    const statuses = [
      { name: 'Auto-Approved', count: d.auto_approved, color: 'green' },
      { name: 'Needs Review', count: d.needs_review, color: 'amber' },
      { name: 'Failed', count: d.failed, color: 'red' }
    ];

    document.getElementById('statusList').innerHTML = statuses.map(s => `
      <div class="status-item">
        <div class="status-left">
          <div class="status-dot-large ${s.color}"></div>
          <div class="status-name">${s.name}</div>
        </div>
        <div class="status-right">
          <div class="status-count">${s.count}</div>
          <div class="status-percent">${((s.count / total) * 100).toFixed(1)}%</div>
        </div>
      </div>
    `).join('');

    // Confidence Circle
    const conf = d.avg_confidence || 0;
    const deg = (conf / 100) * 360;
    setTimeout(() => {
      document.getElementById('confCircle').style.setProperty('--deg', deg + 'deg');
      document.getElementById('confValue').textContent = conf.toFixed(1) + '%';
    }, 100);

    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

  } catch (e) {
    document.getElementById('loading').innerHTML = `<div style="color:#f87171">Failed to load: ${e.message}</div>`;
  }
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
