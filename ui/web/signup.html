<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — DocuExtract AI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter','Segoe UI',system-ui,sans-serif; }
  html, body { background:#050814; color:#e2e8f0; min-height:100vh; }
  body {
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(1000px 500px at 80% -10%, rgba(139,92,246,.25), transparent 60%),
      radial-gradient(800px 400px at 10% 0%, rgba(6,182,212,.18), transparent 60%),
      #050814;
    padding:20px;
  }

  .card {
    width:100%; max-width:440px;
    background:rgba(9,13,28,.85);
    border:1px solid rgba(148,163,184,.15);
    border-radius:20px;
    padding:40px 32px;
    backdrop-filter:blur(20px);
    box-shadow:0 24px 60px rgba(0,0,0,.5);
  }

  .brand { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:8px; }
  .brand-mark {
    width:48px; height:48px; border-radius:14px;
    background:linear-gradient(135deg,#06b6d4,#8b5cf6);
    display:grid; place-items:center; font-size:24px;
    box-shadow:0 8px 24px rgba(139,92,246,.4);
  }
  .brand h1 { font-size:22px; }
  .brand h1 span { background:linear-gradient(135deg,#22d3ee,#a78bfa);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

  .tagline { text-align:center; color:#64748b; font-size:12px;
    letter-spacing:.2em; text-transform:uppercase; margin-bottom:32px; }

  h2 { font-size:24px; text-align:center; margin-bottom:6px; }
  .sub { text-align:center; color:#94a3b8; font-size:14px; margin-bottom:26px; }

  .form-group { margin-bottom:16px; }
  label { display:block; font-size:12px; color:#94a3b8; margin-bottom:6px; font-weight:500; }
  input {
    width:100%; padding:12px 14px;
    background:rgba(15,23,42,.8);
    border:1px solid rgba(148,163,184,.2);
    border-radius:10px; color:#e2e8f0;
    font-size:14px; font-family:inherit;
    transition:.2s;
  }
  input:focus { outline:none; border-color:#22d3ee; box-shadow:0 0 0 3px rgba(34,211,238,.1); }
  input::placeholder { color:#475569; }

  .btn {
    width:100%; padding:13px;
    border:none; border-radius:10px;
    font-size:14px; font-weight:700;
    cursor:pointer; font-family:inherit;
    transition:.2s; margin-top:8px;
  }
  .btn-primary {
    background:linear-gradient(135deg,#22d3ee,#8b5cf6);
    color:#fff;
    box-shadow:0 8px 24px rgba(34,211,238,.3);
  }
  .btn-primary:hover { transform:translateY(-1px); box-shadow:0 12px 32px rgba(34,211,238,.4); }
  .btn-primary:disabled { opacity:.5; cursor:not-allowed; transform:none; }

  .btn-link {
    background:none; border:none; color:#22d3ee;
    cursor:pointer; font-family:inherit; font-size:12px;
    text-decoration:underline; padding:0; margin-top:8px;
  }
  .btn-link:hover { color:#a78bfa; }

  .otp-input {
    text-align:center;
    font-size:28px !important;
    letter-spacing:.4em;
    font-family:'Courier New', monospace !important;
    font-weight:800;
    padding:16px 12px !important;
  }

  .switch { text-align:center; margin-top:22px; font-size:13px; color:#64748b; }
  .switch a { color:#22d3ee; text-decoration:none; font-weight:600; }
  .switch a:hover { text-decoration:underline; }

  .alert {
    display:none; padding:12px 14px; border-radius:10px;
    font-size:13px; margin-bottom:16px;
  }
  .alert.show { display:block; }
  .alert-error { background:rgba(239,68,68,.12); color:#f87171; border:1px solid rgba(239,68,68,.3); }
  .alert-success { background:rgba(16,185,129,.12); color:#34d399; border:1px solid rgba(16,185,129,.3); }
  .alert-info { background:rgba(34,211,238,.12); color:#22d3ee; border:1px solid rgba(34,211,238,.3); }

  .spinner {
    display:inline-block; width:14px; height:14px;
    border:2px solid currentColor; border-bottom-color:transparent;
    border-radius:50%; animation:spin .8s linear infinite;
    margin-right:8px; vertical-align:middle;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .hidden { display:none !important; }

  .back-link {
    text-align:center;
    margin-top:16px;
  }
  .back-link a {
    color:#64748b; font-size:12px; text-decoration:none;
  }
  .back-link a:hover { color:#22d3ee; }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-mark">📄</div>
    <h1>DocuExtract <span>AI</span></h1>
  </div>
  <div class="tagline">Document Intelligence</div>

  <!-- ============================================== -->
  <!-- SCREEN 1: SIGNUP FORM -->
  <!-- ============================================== -->
  <div id="signupScreen">
    <h2>Create your account</h2>
    <p class="sub">Start extracting data in 30 seconds</p>

    <div id="alertSignup" class="alert"></div>

    <form id="signupForm" onsubmit="return handleSignup(event)">
      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" placeholder="Tanush Sharma" required>
      </div>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="tanush" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" id="signupBtn">Create Account</button>
    </form>

    <div class="switch">
      Already have an account? <a href="/ui/login.html">Sign in</a>
    </div>

    <div class="back-link">
      <a href="/ui/landing.html">← Back to home</a>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- SCREEN 2: OTP VERIFICATION -->
  <!-- ============================================== -->
  <div id="otpScreen" class="hidden">
    <h2>Verify your email</h2>
    <p class="sub">Enter the 6-digit code sent to <strong id="otpEmail" style="color:#22d3ee;"></strong></p>

    <div id="alertOtp" class="alert"></div>

    <form id="otpForm" onsubmit="return handleVerifyOtp(event)">
      <div class="form-group">
        <label for="otp">Verification Code</label>
        <input type="text" id="otp" class="otp-input" placeholder="000000"
               maxlength="6" pattern="[0-9]{6}" required
               inputmode="numeric" autocomplete="one-time-code">
      </div>
      <button type="submit" class="btn btn-primary" id="otpBtn">Verify & Sign In</button>
    </form>

    <div style="text-align:center;margin-top:14px;">
      <button class="btn-link" id="resendBtn" onclick="resendOtp()">Didn't receive it? Resend code</button>
    </div>

    <div class="switch">
      <a href="/ui/signup.html">← Use a different email</a>
    </div>
  </div>
</div>

<script>
  console.log('[Signup] Page loaded');

  let pendingEmail = '';
  let resendCooldown = 0;

  function setAlert(elId, msg, type) {
    const el = document.getElementById(elId);
    el.textContent = msg;
    el.className = 'alert show alert-' + (type || 'error');
  }
  function hideAlert(elId) {
    document.getElementById(elId).className = 'alert';
  }

  // ============================================================
  // STEP 1: SIGNUP
  // ============================================================
  async function handleSignup(e) {
    e.preventDefault();
    hideAlert('alertSignup');

    const btn = document.getElementById('signupBtn');
    const full_name = document.getElementById('full_name').value.trim();
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (password.length < 6) {
      setAlert('alertSignup', 'Password must be at least 6 characters.', 'error');
      return false;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Creating account…';

    try {
      const res = await fetch('/api/v1/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ full_name, username, email, password })
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        throw new Error(data.detail || ('HTTP ' + res.status));
      }

      console.log('[Signup] Success, moving to OTP screen');
      pendingEmail = email;

      // Switch to OTP screen
      document.getElementById('signupScreen').classList.add('hidden');
      document.getElementById('otpScreen').classList.remove('hidden');
      document.getElementById('otpEmail').textContent = email;

      setAlert('alertOtp', '✅ Code sent! Check your email inbox.', 'success');
      document.getElementById('otp').focus();

    } catch (err) {
      console.error('[Signup] Error:', err);
      setAlert('alertSignup', err.message || 'Signup failed', 'error');
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }

    return false;
  }

  // ============================================================
  // STEP 2: VERIFY OTP
  // ============================================================
  async function handleVerifyOtp(e) {
    e.preventDefault();
    hideAlert('alertOtp');

    const btn = document.getElementById('otpBtn');
    const otp = document.getElementById('otp').value.trim();

    if (otp.length !== 6) {
      setAlert('alertOtp', 'Please enter the 6-digit code.', 'error');
      return false;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Verifying…';

    try {
      const res = await fetch('/api/v1/auth/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: pendingEmail, otp })
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        throw new Error(data.detail || ('HTTP ' + res.status));
      }

      // Save tokens
      localStorage.setItem('token', data.access_token);
      if (data.refresh_token) localStorage.setItem('refresh_token', data.refresh_token);
      if (data.user && data.user.username) localStorage.setItem('username', data.user.username);

      console.log('[Signup] OTP verified, redirecting to dashboard');
      setAlert('alertOtp', '✅ Verified! Redirecting…', 'success');

      setTimeout(() => {
        window.location.href = '/ui/index.html';
      }, 600);

    } catch (err) {
      console.error('[Signup] OTP error:', err);
      setAlert('alertOtp', err.message || 'Verification failed', 'error');
      btn.disabled = false;
      btn.textContent = 'Verify & Sign In';
    }

    return false;
  }

  // ============================================================
  // STEP 3: RESEND OTP
  // ============================================================
  async function resendOtp() {
    if (resendCooldown > 0) return;

    const btn = document.getElementById('resendBtn');
    hideAlert('alertOtp');

    try {
      const res = await fetch('/api/v1/auth/resend-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: pendingEmail })
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        throw new Error(data.detail || ('HTTP ' + res.status));
      }

      setAlert('alertOtp', '✅ New code sent! Check your email.', 'success');

      // Cooldown 30s
      resendCooldown = 30;
      btn.disabled = true;
      btn.textContent = 'Resend in ' + resendCooldown + 's';

      const t = setInterval(() => {
        resendCooldown--;
        if (resendCooldown <= 0) {
          clearInterval(t);
          btn.disabled = false;
          btn.textContent = "Didn't receive it? Resend code";
        } else {
          btn.textContent = 'Resend in ' + resendCooldown + 's';
        }
      }, 1000);

    } catch (err) {
      console.error('[Signup] Resend error:', err);
      setAlert('alertOtp', err.message || 'Resend failed', 'error');
    }
  }

  // Auto-focus OTP input when typing numbers only
  document.addEventListener('DOMContentLoaded', () => {
    const otpInput = document.getElementById('otp');
    if (otpInput) {
      otpInput.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 6);
      });
    }
  });
</script>
</body>
</html>
